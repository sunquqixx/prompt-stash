<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>候选提示词</title>
<style>
  :root {
    --bg: #1e1f24;
    --fg: #e6e6e9;
    --panel: #2a2b32;
    --panel-hover: #33343c;
    --border: #33343c;
    --muted: #b8b9c0;
    --muted2: #8a8b93;
    --hint: #6b6c75;
    --accent: #ffffff;          /* 深色主题下用白底 */
    --accent-hover: #e4e4e8;
    --on-accent: #1e1f24;       /* 白底上的文字 */
    --due-over: #ff6b6b;        /* 逾期 */
    --due-today: #ffa94d;       /* 今天 */
    --due-soon: #ffd43b;        /* 三天内 */
    --input-border: #3a3b43;
    --btn-hover: #3a3b43;
    --badge-border: #4a4b53;
    --card-border: transparent;
  }
  body.light {
    --bg: #f2f2f4;
    --fg: #1d1d1f;
    --panel: #ffffff;
    --panel-hover: #e8e8ec;
    --border: #d9d9de;
    --muted: #5f6067;
    --muted2: #86868b;
    --hint: #a1a1a6;
    --input-border: #d0d0d5;
    --btn-hover: #e4e4e9;
    --badge-border: #c7c7cc;
    --card-border: #e2e2e6;
    --accent: #4a5af0;          /* 浅色主题仍用蓝色 */
    --accent-hover: #5a6af8;
    --on-accent: #ffffff;
    --due-over: #d92c2c;
    --due-today: #c26a00;
    --due-soon: #9a7b00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    font-size: 13px;
    user-select: none;
  }

  /* 顶栏：分组标签 */
  #tabbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 8px 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .spacer { flex: 1; }
  /* 折叠：整窗只剩顶栏一行，里面只有条数摘要；整行可点，再点展开 */
  #collapsedBar { display: none; }
  body.collapsed #collapsedBar {
    display: block;
    flex: 1;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body.collapsed #list,
  body.collapsed #composer,
  body.collapsed #groupWrap,
  body.collapsed #modeSwitch,
  body.collapsed .iconBtn { display: none !important; }
  body.collapsed #tabbar {
    border-bottom: none;
    padding: 7px 12px;
  }
  #tabbar { cursor: default; }
  #tabbar .spacer, body.collapsed #tabbar { cursor: pointer; }
  /* 板块切换：提示词 / 待办 */
  #modeSwitch {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    margin-left: 6px;
    padding: 2px;
    border-radius: 6px;
    background: var(--panel);
  }
  #modeSwitch button {
    padding: 3px 8px;
    border: none;
    background: none;
    border-radius: 4px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
  }
  #modeSwitch button:hover { background: var(--panel-hover); }
  #modeSwitch button.on { background: var(--accent); color: var(--on-accent); }
  #modeSwitch button.on:hover { background: var(--accent); }
  #groupWrap { position: relative; min-width: 0; }
  #groupBtn {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 110px;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  #groupName {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #groupBtn .caret { font-size: 10px; opacity: 0.8; }
  #groupMenu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 10;
    min-width: 200px;
    max-width: 300px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    padding: 4px;
  }
  .menuItem {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--fg);
  }
  .menuItem:hover { background: var(--panel-hover); }
  .menuItem .miName {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .menuItem.current .miName { color: var(--accent); font-weight: 600; }
  .menuItem .miBtns { display: none; gap: 2px; }
  .menuItem:hover .miBtns { display: flex; }
  .menuItem .miBtns button {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--muted2);
    cursor: pointer;
    font-size: 10px;
    padding: 2px 3px;
    border-radius: 4px;
  }
  .menuItem .miBtns button:hover { background: var(--btn-hover); color: var(--fg); }
  .menuNew {
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 4px;
    border-radius: 0 0 6px 6px;
  }
  .tabEdit {
    width: 90px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--panel);
    color: var(--fg);
    font-size: 13px;
    outline: none;
    flex-shrink: 0;
  }
  .iconBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 6px;
    border-radius: 6px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
  }
  .iconBtn:hover { background: var(--panel-hover); }
  .iconBtn.active { background: var(--accent); color: var(--on-accent); }
  .iconBtn.off { opacity: 0.4; }

  /* 中部列表 */
  #list {
    flex: 1;
    overflow-y: auto;
    overflow-anchor: none;   /* 重排卡片时别让浏览器自作主张调整滚动位置 */
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hint {
    color: var(--hint);
    text-align: center;
    margin-top: 40px;
    line-height: 1.8;
    white-space: pre-line;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  .cardLeft {
    flex-shrink: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 14px;
    margin: -2px 0 -2px -4px;
  }
  .dragHandle {
    flex: 1;
    min-height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--muted2);
    font-size: 11px;
    line-height: 1;
    opacity: 0.4;
    cursor: grab;
    touch-action: none;
  }
  .dragHandle:hover { opacity: 1; background: var(--btn-hover); }
  .collapseBtn {
    flex-shrink: 0;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    background: none;
    border-radius: 4px;
    color: var(--muted2);
    font-size: 9px;
    line-height: 1;
    opacity: 0.4;
    cursor: pointer;
  }
  .collapseBtn:hover { opacity: 1; background: var(--btn-hover); }
  /* 折叠态：内边距收窄、把手缩短，配合右侧只留编辑键，卡片高度砍掉一半以上 */
  .card.collapsed { padding: 5px 10px; }
  .card.collapsed .cardLeft { gap: 0; }
  .card.collapsed .dragHandle { min-height: 11px; font-size: 10px; }
  .card.collapsed .collapseBtn { height: 10px; }
  .card.collapsed .cardBtns { gap: 0; }
  /* 折叠态：只留一行，末尾自动省略号 */
  .cardText.collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-height: none;
  }
  .card.dragging {
    position: relative;
    z-index: 5;
    cursor: grabbing;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    border-color: var(--accent);
    will-change: transform;   /* 交给显卡单独合成，拖动时不必反复重绘阴影 */
  }
  .card.dragging .dragHandle { opacity: 1; cursor: grabbing; }
  #list.dragging-active .cardText { user-select: none; }
  .cardText {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    max-height: 130px;
    overflow-y: auto;
    cursor: pointer;
    user-select: text;
  }
  /* 待办：已完成划线 */
  .cardText.doneText {
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    color: var(--muted2);
  }
  .cardBtns button.doneOn { color: var(--accent); opacity: 1; }
  /* 待办：到期日小标签 */
  .dateChip {
    flex-shrink: 0;
    align-self: flex-start;
    height: 16px;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 4px;
    border: none;
    background: none;
    border-radius: 4px;
    color: var(--muted2);
    font-size: 10px;
    line-height: 1;
    white-space: nowrap;
    opacity: 0.4;
    cursor: pointer;
  }
  .dateChip:hover { opacity: 1; background: var(--btn-hover); }
  .dateChip.set { opacity: 1; }
  .dateChip.over { color: var(--due-over); }
  .dateChip.today { color: var(--due-today); }
  .dateChip.soon { color: var(--due-soon); }
  /* 小日历：画在窗口层（fixed），否则会被可滚动的列表区裁掉 */
  .datePop {
    position: fixed;
    z-index: 100;
    width: 200px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  .dpHead { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .dpTitle { flex: 1; text-align: center; font-size: 12px; color: var(--fg); }
  .dpNav {
    width: 20px; height: 20px; padding: 0;
    border: none; background: none; border-radius: 4px;
    color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer;
  }
  .dpNav:hover { background: var(--btn-hover); color: var(--fg); }
  .dpGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dpWeek span { text-align: center; font-size: 10px; color: var(--hint); line-height: 16px; }
  .dpDay {
    height: 22px; padding: 0;
    border: none; background: none; border-radius: 4px;
    color: var(--fg); font-size: 11px; cursor: pointer;
  }
  .dpDay:hover { background: var(--btn-hover); }
  .dpToday { color: var(--due-today); font-weight: 600; }
  .dpSel { background: var(--accent); color: var(--on-accent); }
  .dpSel:hover { background: var(--accent); }
  .dpFoot {
    display: flex; align-items: center; gap: 4px;
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .dpQuick {
    padding: 3px 6px;
    border: none; background: none; border-radius: 4px;
    color: var(--muted); font-size: 11px; cursor: pointer;
  }
  .dpQuick:hover { background: var(--btn-hover); color: var(--fg); }
  .cardMeta {
    font-size: 11px;
    color: var(--hint);
    margin-top: 4px;
  }
  .cardEdit {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--fg);
    padding: 6px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
    max-height: 200px;
  }
  .cardBtns { display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
  .cardBtns button {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--muted2);
    cursor: pointer;
    font-size: 10px;
    line-height: 1;
    padding: 2px 3px;
    border-radius: 4px;
  }
  .cardBtns button:hover { background: var(--btn-hover); color: var(--fg); }
  .cardBtns button.favOn { color: #f0b429; }
  .cardBtns button.favOn:hover { color: #f0b429; }

  /* 底部输入区 */
  #composer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 8px;
    display: flex;
    gap: 6px;
    align-items: flex-end;
  }
  #draft {
    flex: 1;
    resize: none;
    height: 64px;
    background: var(--panel);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    color: var(--fg);
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.5;
    outline: none;
  }
  #draft:focus { border-color: var(--accent); }
  #addBtn {
    background: var(--accent);
    border: none;
    color: var(--on-accent);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
  }
  #addBtn:hover { background: var(--accent-hover); }

  /* 复制反馈 */
  #toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--on-accent);
    padding: 6px 14px;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="collapsedBar"></div>
    <div id="groupWrap">
      <button id="groupBtn" title="切换分组"><span id="groupName"></span><span class="caret">▾</span></button>
      <div id="groupMenu" style="display: none"></div>
    </div>
    <div id="modeSwitch">
      <button data-mode="prompt">提示词</button>
      <button data-mode="todo">待办</button>
    </div>
    <div class="spacer"></div>
    <button class="iconBtn" id="favBtn" title="收藏区"></button>
    <button class="iconBtn" id="trashBtn" title="回收站（保留 7 天）"></button>
    <button class="iconBtn" id="pinBtn" title="置顶开关"></button>
    <button class="iconBtn" id="themeBtn" title="切换主题"></button>
  </div>
  <div id="list"></div>
  <div id="composer">
    <textarea id="draft" placeholder="写下一条候选提示词…（⌘+Enter 添加）"></textarea>
    <button id="addBtn">添加</button>
  </div>
  <div id="toast"></div>

<script>
let state = null
let view = 'group'          // 'group' | 'fav' | 'trash'
let menuOpen = false        // 分组下拉菜单是否展开
const TRASH_KEEP_MS = 7 * 24 * 3600 * 1000   // 回收站保留 7 天
const drafts = {}           // groupId -> 未发送的草稿（仅本次运行内暂存）

const IS_MAC = navigator.platform.toLowerCase().includes('mac')
const MOD = IS_MAC ? '⌘' : 'Ctrl'

/* 细线条图标：全部用 currentColor 描边，风格与拖拽把手 ⠿、折叠键 ▾ 统一。
   用 SVG 而非字符，是为了 macOS 和 Windows 上粗细完全一致。 */
const ICONS = {
  edit:    '<path d="M9.8 2.2l2 2L4.8 11.2 2.2 11.8l.6-2.6z"/>',
  star:    '<path d="M7 1.6l1.7 3.4 3.8.6-2.75 2.7.65 3.8L7 10.3 3.6 12.1l.65-3.8L1.5 5.6l3.8-.6z"/>',
  trash:   '<path d="M2.4 3.6h9.2M5.4 3.6V2h3.2v1.6M3.9 3.6l.55 8.1h5.1l.55-8.1"/>',
  pin:     '<path d="M4.8 1.8h4.4M7 1.8v3.6M3.4 5.4h7.2M7 5.4v6.8"/>',
  sun:     '<circle cx="7" cy="7" r="2.5"/><path d="M7 1.3v1.5M7 11.2v1.5M1.3 7h1.5M11.2 7h1.5M3 3l1.05 1.05M9.95 9.95L11 11M11 3L9.95 4.05M4.05 9.95L3 11"/>',
  moon:    '<path d="M11.3 8.7A5.1 5.1 0 015.3 2.7 5.1 5.1 0 1011.3 8.7z"/>',
  restore: '<path d="M2.4 5.6h6.4a3.1 3.1 0 010 6.2H5.8M2.4 5.6L5 3M2.4 5.6L5 8.2"/>',
  close:   '<path d="M3.4 3.4l7.2 7.2M10.6 3.4l-7.2 7.2"/>',
  check:   '<path d="M2.8 7.4l2.9 2.9 5.5-6.6"/>',
  calendar:'<rect x="2" y="3" width="10" height="9" rx="1.4"/><path d="M2 5.9h10M4.7 1.8v2M9.3 1.8v2"/>',
}
function icon(name, size, filled) {
  return '<svg viewBox="0 0 14 14" width="' + size + '" height="' + size + '" aria-hidden="true"'
    + ' fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.25"'
    + ' stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>'
}

const $ = (id) => document.getElementById(id)
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7)
const activeGroup = () => state.groups.find(g => g.id === state.activeGroupId) || null

/* ---------- 待办板块 ---------- */
// 时间管理四象限。id 固定，名字可以自己改。
const QUADRANTS = [
  { id: 'q1', name: '重要且紧急' },
  { id: 'q2', name: '重要不紧急' },
  { id: 'q3', name: '紧急不重要' },
  { id: 'q4', name: '不重要不紧急' },
]
const isTodo = () => state.mode === 'todo'
const activeTodoGroup = () => state.todoGroups.find(g => g.id === state.activeTodoGroupId) || null
// 当前板块下「正在看的那一组」和「它底下的条目数组」
const curGroup = () => (isTodo() ? activeTodoGroup() : activeGroup())
const curItems = () => { const g = curGroup(); return g ? (isTodo() ? g.todos : g.prompts) : null }

function save() { window.api.saveData(state) }

function toast(msg) {
  const t = $('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(toast._timer)
  toast._timer = setTimeout(() => t.classList.remove('show'), 1200)
}

async function copyText(text) {
  await window.api.copyText(text)
  toast('已复制')
}

/* 折叠态那行字：只报数，不出现分组名 */
function collapsedSummary() {
  // 数分组里的全部条数：真正用完的会被直接删掉，留着的就都是没发的
  const pend = state.groups.reduce((n, g) => n + g.prompts.length, 0)
  const todo = state.todoGroups.reduce((n, g) => n + g.todos.filter(t => !t.done).length, 0)
  const parts = []
  if (pend) parts.push(pend + ' 条待发送')
  if (todo) parts.push(todo + ' 条待办')
  return parts.length ? parts.join('  ·  ') : '都处理完了'
}

function applyCollapsed(capture) {
  document.body.classList.toggle('collapsed', !!state.collapsed)
  if (state.collapsed) {
    // 必须先把摘要文字填进去再量高度：启动时 render() 还没跑，
    // 空行量出来只有内边距的高度，窗口会被压成一条缝。
    $('collapsedBar').textContent = collapsedSummary()
    window.api.setHeight($('tabbar').offsetHeight, false).then((h) => {
      // 展开高度由主进程量，这里只负责存盘；启动时的那次不采集，免得覆盖掉记住的值
      if (capture && h && h !== state.expandedHeight) {
        state.expandedHeight = h
        save()
      }
    })
  } else {
    window.api.setHeight(state.expandedHeight || 560, true)
  }
}

function setCollapsed(v) {
  state.collapsed = v
  save()
  applyCollapsed(true)
  render()
}

function applySettings() {
  document.body.classList.toggle('light', state.theme === 'light')
  $('themeBtn').innerHTML = icon(state.theme === 'light' ? 'moon' : 'sun', 14)
  $('pinBtn').className = 'iconBtn' + (state.pinned ? ' active' : ' off')
}

let lastRenderKey = null

function render() {
  const list = $('list')
  const key = view + ':' + state.mode + ':' + (isTodo() ? state.activeTodoGroupId : state.activeGroupId)
  const keptScroll = list.scrollTop      // 重建列表会把滚动位置清零，这里存下来还原
  renderTabs()
  if (view === 'fav') renderFavorites()
  else if (view === 'trash') renderTrash()
  else if (isTodo()) renderTodoList()
  else renderGroupList()
  list.scrollTop = key === lastRenderKey ? keptScroll : 0   // 换视图/换分组才回到顶部
  lastRenderKey = key
}

function trashItem(kind, text, groupId, groupName, createdAt, due) {
  state.trash.push({
    id: uid(), kind, text, due,
    sourceGroupId: groupId, sourceGroup: groupName,
    createdAt, deletedAt: Date.now(),
  })
}

/* 通用：行内文字输入（新建/重命名分组共用），防 Enter+blur 重复提交 */
function inlineInput({ initial, onDone }) {
  const input = document.createElement('input')
  input.className = 'tabEdit'
  input.value = initial || ''
  let finished = false
  const done = (commit) => {
    if (finished) return
    finished = true
    onDone(commit ? input.value.trim() : '')
  }
  input.onkeydown = (e) => {
    if (e.key === 'Enter') done(true)
    if (e.key === 'Escape') done(false)
  }
  input.onblur = () => done(true)
  return input
}

function renderTabs() {
  const todo = isTodo()
  const g = curGroup()
  $('groupName').textContent = g ? g.name : '新建分组…'
  for (const b of $('modeSwitch').children) {
    b.className = b.dataset.mode === state.mode ? 'on' : ''
  }
  // 待办没有收藏概念，隐藏收藏区入口（顺便腾出横向空间）
  $('favBtn').style.display = todo ? 'none' : ''
  $('collapsedBar').textContent = collapsedSummary()
  $('draft').placeholder = todo
    ? `写下一条待办…（${MOD}+Enter 添加）`
    : `写下一条候选提示词…（${MOD}+Enter 添加）`
  const menu = $('groupMenu')
  menu.style.display = menuOpen ? 'block' : 'none'
  menu.textContent = ''
  if (menuOpen && todo) {
    // 四象限固定 4 个：可改名，不可删除、不可新增
    for (const grp of state.todoGroups) menu.appendChild(menuRow(grp, true))
  } else if (menuOpen) {
    for (const grp of state.groups) menu.appendChild(menuRow(grp, false))
    const add = document.createElement('div')
    add.className = 'menuItem menuNew'
    add.textContent = '＋ 新建分组'
    add.onclick = (e) => {
      e.stopPropagation()
      const input = inlineInput({
        onDone: (name) => {
          if (name) {
            const ng = { id: uid(), name, prompts: [] }
            state.groups.push(ng)
            state.activeGroupId = ng.id
            view = 'group'
            menuOpen = false
            save()
          }
          render()
        },
      })
      input.placeholder = '分组名'
      input.onclick = (e2) => e2.stopPropagation()
      add.replaceWith(input)
      input.focus()
    }
    menu.appendChild(add)
  }
  $('favBtn').className = 'iconBtn' + (view === 'fav' ? ' active' : '')
  $('trashBtn').className = 'iconBtn' + (view === 'trash' ? ' active' : '')
}

function menuRow(grp, todo) {
  const cur = todo ? state.activeTodoGroupId : state.activeGroupId
  const row = document.createElement('div')
  row.className = 'menuItem' + (grp.id === cur ? ' current' : '')

  const name = document.createElement('span')
  name.className = 'miName'
  name.textContent = todo
    ? grp.name + '  ' + grp.todos.filter(t => !t.done).length   // 未完成条数
    : grp.name
  row.onclick = () => {
    if (todo) state.activeTodoGroupId = grp.id
    else state.activeGroupId = grp.id
    view = 'group'
    menuOpen = false
    save()
    render()
  }

  const btns = document.createElement('span')
  btns.className = 'miBtns'

  const renameBtn = document.createElement('button')
  renameBtn.innerHTML = icon('edit', 11)
  renameBtn.title = '改名'
  renameBtn.onclick = (e) => {
    e.stopPropagation()
    const input = inlineInput({
      initial: grp.name,
      onDone: (n) => {
        if (n) { grp.name = n; save() }
        render()
      },
    })
    input.onclick = (e2) => e2.stopPropagation()
    name.replaceWith(input)
    input.focus()
    input.select()
  }

  const delBtn = document.createElement('button')
  delBtn.innerHTML = icon('close', 11)
  delBtn.title = '删除分组'
  delBtn.onclick = (e) => {
    e.stopPropagation()
    if (!confirm(`删除分组「${grp.name}」及其所有提示词？`)) return
    for (const p of grp.prompts) trashItem('prompt', p.text, grp.id, grp.name, p.createdAt)
    state.groups = state.groups.filter(x => x.id !== grp.id)
    if (state.activeGroupId === grp.id) state.activeGroupId = state.groups[0]?.id || null
    delete drafts[grp.id]
    save()
    render()
  }

  if (todo) btns.append(renameBtn)          // 四象限固定，不给删除
  else btns.append(renameBtn, delBtn)
  row.append(name, btns)
  return row
}

function renderGroupList() {
  const list = $('list')
  list.textContent = ''
  const g = activeGroup()

  $('composer').style.display = g ? 'flex' : 'none'
  if (g) $('draft').value = drafts[g.id] || ''

  if (!g) {
    const hint = document.createElement('div')
    hint.className = 'hint'
    hint.textContent = '还没有分组\n点左上角菜单新建一个'
    list.appendChild(hint)
    return
  }
  if (g.prompts.length === 0) {
    const hint = document.createElement('div')
    hint.className = 'hint'
    hint.textContent = '在下方写第一条候选提示词'
    list.appendChild(hint)
    return
  }
  for (const p of g.prompts) {
    list.appendChild(promptCard(p, g))
  }
}

function promptCard(p, g) {
  const card = document.createElement('div')
  card.className = 'card' + (p.collapsed ? ' collapsed' : '')
  card.dataset.id = p.id

  const left = buildLeftRail(card, p, g.prompts)

  const textWrap = document.createElement('div')
  textWrap.className = 'cardText' + (p.collapsed ? ' collapsed' : '')
  textWrap.title = '点击复制'
  textWrap.textContent = p.text
  textWrap.onclick = () => copyText(p.text)

  const btns = document.createElement('div')
  btns.className = 'cardBtns'

  const editBtn = document.createElement('button')
  editBtn.innerHTML = icon('edit', 11)
  editBtn.title = `编辑（${MOD}+Enter 保存，Esc 取消）`
  editBtn.onclick = () => startEditPrompt(p, textWrap)

  const favBtn = document.createElement('button')
  const isFav = state.favorites.some(f => f.text === p.text)
  favBtn.innerHTML = icon('star', 11, isFav)
  favBtn.className = isFav ? 'favOn' : ''
  favBtn.title = isFav ? '取消收藏' : '收藏'
  favBtn.onclick = () => {
    if (isFav) {
      state.favorites = state.favorites.filter(f => f.text !== p.text)
      toast('已取消收藏')
    } else {
      state.favorites.unshift({ id: uid(), text: p.text, sourceGroup: g.name, createdAt: Date.now() })
      toast('已收藏')
    }
    save()
    render()
  }

  const delBtn = document.createElement('button')
  delBtn.innerHTML = icon('close', 11)
  delBtn.title = '删除（进回收站，保留 7 天）'
  delBtn.onclick = () => {
    trashItem('prompt', p.text, g.id, g.name, p.createdAt)
    g.prompts = g.prompts.filter(x => x.id !== p.id)
    save()
    render()
    toast('已移入回收站')
  }

  // 折叠时只保留编辑键：右侧按钮列是卡片高度的下限，留三个就压不下去
  if (p.collapsed) btns.append(editBtn)
  else btns.append(editBtn, favBtn, delBtn)
  card.append(left, textWrap, btns)
  return card
}

/* 卡片左栏：拖拽把手 + 折叠键（提示词和待办共用） */
function buildLeftRail(card, item, arr) {
  const left = document.createElement('div')
  left.className = 'cardLeft'

  const handle = document.createElement('div')
  handle.className = 'dragHandle'
  handle.textContent = '\u283F'
  handle.title = '按住拖动排序'
  handle.onpointerdown = (e) => startDrag(e, card, arr)

  const collapseBtn = document.createElement('button')
  collapseBtn.className = 'collapseBtn'
  collapseBtn.textContent = item.collapsed ? '\u25B8' : '\u25BE'
  collapseBtn.title = item.collapsed ? '展开' : '折叠'
  collapseBtn.onclick = () => {
    item.collapsed = !item.collapsed
    save()
    render()
  }
  left.append(handle, collapseBtn)
  return left
}

/* ---------- 待办事项 ---------- */
function renderTodoList() {
  const list = $('list')
  list.textContent = ''
  const g = activeTodoGroup()
  $('composer').style.display = 'flex'
  $('draft').value = drafts[g.id] || ''

  if (!g.todos.length) {
    const hint = document.createElement('div')
    hint.className = 'hint'
    hint.textContent = '「' + g.name + '」还没有待办\n在下方写第一条'
    list.appendChild(hint)

  }
  for (const t of g.todos) list.appendChild(todoCard(t, g))
}

function todoCard(t, g) {
  const card = document.createElement('div')
  card.className = 'card' + (t.collapsed ? ' collapsed' : '')
  card.dataset.id = t.id

  const left = buildLeftRail(card, t, g.todos)

  const textWrap = document.createElement('div')
  textWrap.className = 'cardText' + (t.collapsed ? ' collapsed' : '') + (t.done ? ' doneText' : '')
  textWrap.title = '点击编辑'
  textWrap.textContent = t.text
  textWrap.onclick = () => startEditPrompt(t, textWrap)

  const chip = dateChip(t)

  const btns = document.createElement('div')
  btns.className = 'cardBtns'

  const doneBtn = document.createElement('button')
  doneBtn.innerHTML = icon('check', 11)
  doneBtn.className = t.done ? 'doneOn' : ''
  doneBtn.title = t.done ? '标记为未完成' : '标记为已完成'
  doneBtn.onclick = () => {
    t.done = !t.done
    save()
    render()
  }

  const delBtn = document.createElement('button')
  delBtn.innerHTML = icon('close', 11)
  delBtn.title = '删除（进回收站，保留 7 天）'
  delBtn.onclick = () => {
    trashItem('todo', t.text, g.id, g.name, t.createdAt, t.due)
    g.todos = g.todos.filter(x => x.id !== t.id)
    save()
    render()
    toast('已移入回收站')
  }

  // 折叠时只留「完成」，把卡片压到一行高
  if (t.collapsed) btns.append(doneBtn)
  else btns.append(doneBtn, delBtn)

  card.append(left, textWrap, chip, btns)
  return card
}

/* 到期日：小标签 + 系统原生日历 */
function daysUntil(due) {
  const today = new Date(); today.setHours(0, 0, 0, 0)
  const d = new Date(due + 'T00:00:00')
  return Math.round((d - today) / 86400000)
}

function dateChip(t) {
  const chip = document.createElement('button')
  let cls = 'dateChip', label = ''
  if (t.due) {
    const n = daysUntil(t.due)
    const d = new Date(t.due + 'T00:00:00')
    label = n === 0 ? '今天' : n === 1 ? '明天' : (d.getMonth() + 1) + '/' + d.getDate()
    cls += ' set' + (n < 0 ? ' over' : n === 0 ? ' today' : n <= 3 ? ' soon' : '')
  }
  chip.className = cls
  chip.title = t.due ? '点击改到期日（清空即取消）' : '设置到期日'
  chip.innerHTML = icon('calendar', 10) + (label ? '<span>' + label + '</span>' : '')
  chip.onclick = (e) => { e.stopPropagation(); openDatePicker(t, chip) }
  return chip
}

const ymd = (d) => d.getFullYear() + '-'
  + String(d.getMonth() + 1).padStart(2, '0') + '-'
  + String(d.getDate()).padStart(2, '0')

let datePop = null

function closeDatePicker() {
  if (!datePop) return
  datePop.remove()
  datePop = null
  document.removeEventListener('click', outsideCloseDate)
}
function outsideCloseDate(e) {
  if (datePop && !datePop.contains(e.target)) closeDatePicker()
}

/* 小日历：打开就停在当月，点一下日子即可；年月只有跨月时才需要动 */
function openDatePicker(t, chip) {
  closeDatePicker()
  const base = t.due ? new Date(t.due + 'T00:00:00') : new Date()
  let viewY = base.getFullYear(), viewM = base.getMonth()

  const pop = document.createElement('div')
  pop.className = 'datePop'
  // 日历内部的点击一律不外传：换月会把内容整个重画，
  // 被点的按钮届时已不在页面上，外面那个「点到日历之外就关闭」的判断会误判。
  pop.onclick = (e) => e.stopPropagation()
  const pick = (iso) => {
    t.due = iso || undefined
    save()
    closeDatePicker()
    render()
  }

  const draw = () => {
    pop.textContent = ''
    const head = document.createElement('div')
    head.className = 'dpHead'
    const nav = (label, step) => {
      const b = document.createElement('button')
      b.className = 'dpNav'
      b.textContent = label
      b.onclick = () => {
        viewM += step
        if (viewM < 0) { viewM = 11; viewY-- }
        if (viewM > 11) { viewM = 0; viewY++ }
        draw()
      }
      return b
    }
    const title = document.createElement('span')
    title.className = 'dpTitle'
    title.textContent = viewY + '年' + (viewM + 1) + '月'
    head.append(nav('\u2039', -1), title, nav('\u203A', 1))

    const wk = document.createElement('div')
    wk.className = 'dpGrid dpWeek'
    for (const w of ['一', '二', '三', '四', '五', '六', '日']) {
      const c = document.createElement('span')
      c.textContent = w
      wk.appendChild(c)
    }

    const grid = document.createElement('div')
    grid.className = 'dpGrid'
    const lead = (new Date(viewY, viewM, 1).getDay() + 6) % 7   // 周一排第一列
    const days = new Date(viewY, viewM + 1, 0).getDate()
    const todayIso = ymd(new Date())
    for (let i = 0; i < lead; i++) grid.appendChild(document.createElement('span'))
    for (let d = 1; d <= days; d++) {
      const iso = ymd(new Date(viewY, viewM, d))
      const cell = document.createElement('button')
      cell.className = 'dpDay' + (iso === todayIso ? ' dpToday' : '') + (t.due === iso ? ' dpSel' : '')
      cell.textContent = d
      cell.onclick = () => pick(iso)
      grid.appendChild(cell)
    }

    const foot = document.createElement('div')
    foot.className = 'dpFoot'
    const quick = (label, fn) => {
      const b = document.createElement('button')
      b.className = 'dpQuick'
      b.textContent = label
      b.onclick = fn
      return b
    }
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1)
    const gap = document.createElement('span'); gap.style.flex = '1'
    foot.append(
      quick('今天', () => pick(ymd(new Date()))),
      quick('明天', () => pick(ymd(tomorrow))),
      gap,
      quick('清除', () => pick(null)),
    )

    pop.append(head, wk, grid, foot)
  }

  draw()
  document.body.appendChild(pop)

  // 贴着日期标签摆；下方放不下就翻到上方，左右也夹在窗口内
  const r = chip.getBoundingClientRect()
  const w = pop.offsetWidth, h = pop.offsetHeight
  pop.style.left = Math.min(Math.max(4, r.left - w + r.width), innerWidth - w - 4) + 'px'
  pop.style.top = (r.bottom + 4 + h > innerHeight - 4 ? Math.max(4, r.top - h - 4) : r.bottom + 4) + 'px'

  datePop = pop
  setTimeout(() => document.addEventListener('click', outsideCloseDate), 0)
}

/* ---------- 拖动排序（自绘，不用浏览器原生 DnD：原生拖拽会把文字带出窗口，
   在这个永远置顶的小窗里等于往下层的 AI 对话框里粘贴内容） ---------- */
let dragState = null

function startDrag(e, card, arr) {
  if (e.button !== 0 || dragState) return
  e.preventDefault()
  const list = $('list')
  dragState = {
    card, arr, list,
    listRect: list.getBoundingClientRect(),   // 拖动中列表本身不会动，量一次就够
    startY: e.clientY,
    lastY: e.clientY,
    prevY: e.clientY,
    dy: 0,
    moved: false,
    raf: requestAnimationFrame(dragFrame),
  }
  // 监听必须挂在 window 上，不能挂把手、也不能依赖 setPointerCapture：
  // 换位时卡片要从 DOM 摘下再插回，这会让指针捕获失效，
  // 之后鼠标一离开那 14px 宽的把手就再也收不到事件，卡片当场定住不动。
  window.addEventListener('pointermove', onDragMove)
  window.addEventListener('pointerup', endDrag)
  window.addEventListener('pointercancel', endDrag)
  window.addEventListener('blur', endDrag)    // 窗口失焦兜底，避免拖拽状态卡死
  list.classList.add('dragging-active')
}

// 鼠标移动只记坐标，一点布局计算都不做。
// 触控板每秒能发一百多次移动事件，在这里干活必然卡。
function onDragMove(e) {
  const s = dragState
  if (!s) return
  s.lastY = e.clientY
  if (!s.moved && Math.abs(e.clientY - s.startY) >= 3) {   // 阈值：轻点不算拖
    s.moved = true
    s.card.classList.add('dragging')
  }
}

// 真正干活的地方：每个画面帧最多跑一次，且严格「先读后写」。
// 读全部集中在开头（此时排版是干净的，不会触发重算），写全部放在末尾。
function dragFrame() {
  const s = dragState
  if (!s) return
  s.raf = requestAnimationFrame(dragFrame)
  if (!s.moved) return

  // 贴边时自动滚动；只有真滚了才需要继续往下算
  const want = autoScrollAmount(s)
  if (want) {
    const before = s.list.scrollTop
    s.list.scrollTop = before + want
    s.startY -= s.list.scrollTop - before   // 列表滚了，卡片要跟着鼠标待在原处
  } else if (s.lastY === s.prevY) {
    return                                   // 鼠标没动也没滚，这一帧不用做任何事
  }
  s.prevY = s.lastY

  // —— 读：拖动的卡 + 最多两个紧邻的卡，次数不随列表变长而增加 ——
  const cardRect = s.card.getBoundingClientRect()
  const nextEl = s.card.nextElementSibling
  const prevEl = s.card.previousElementSibling
  const nextMid = nextEl ? midOf(nextEl) : null
  const prevMid = prevEl ? midOf(prevEl) : null

  // —— 算：纯数学，不碰 DOM。cardRect 含上一帧的位移，先减掉再加本帧的 ——
  const dy = s.lastY - s.startY
  const center = cardRect.top - s.dy + dy + cardRect.height / 2
  const needSwap = (nextMid !== null && center > nextMid) || (prevMid !== null && center < prevMid)

  // —— 写 ——
  s.dy = dy
  s.card.style.transform = `translateY(${dy}px)`
  if (!needSwap) return

  // 一帧之内把该换的位置一次换到位。
  // 只换一格的话，掉帧或快速拖动时卡片就追不上鼠标，表现成「卡住不动」。
  for (let guard = 0; guard < 64; guard++) {
    const r = s.card.getBoundingClientRect()
    const c = r.top + r.height / 2
    const nEl = s.card.nextElementSibling
    const pEl = s.card.previousElementSibling
    let target = null, after = false
    if (nEl && c > midOf(nEl)) { target = nEl; after = true }
    else if (pEl && c < midOf(pEl)) { target = pEl }
    if (!target) break
    s.list.insertBefore(s.card, after ? target.nextSibling : target)
    // 换位后排版变了，补偿 startY 让卡片视觉上停在鼠标下不跳
    s.startY += s.card.getBoundingClientRect().top - r.top
    s.dy = s.lastY - s.startY
    s.card.style.transform = `translateY(${s.dy}px)`
  }
}

function midOf(el) {
  const r = el.getBoundingClientRect()
  return r.top + r.height / 2
}

// 拖到列表上下边缘时自动滚动，越靠边越快（用缓存的列表位置，不读 DOM）
function autoScrollAmount(s) {
  const EDGE = 40
  const r = s.listRect
  if (s.lastY < r.top + EDGE) return -Math.ceil((r.top + EDGE - s.lastY) / 5)
  if (s.lastY > r.bottom - EDGE) return Math.ceil((s.lastY - (r.bottom - EDGE)) / 5)
  return 0
}

function endDrag(commit) {
  const s = dragState
  if (!s) return
  cancelAnimationFrame(s.raf)
  window.removeEventListener('pointermove', onDragMove)
  window.removeEventListener('pointerup', endDrag)
  window.removeEventListener('pointercancel', endDrag)
  window.removeEventListener('blur', endDrag)
  s.list.classList.remove('dragging-active')
  s.card.style.transform = ''
  s.card.classList.remove('dragging')
  const { moved, arr, list } = s
  dragState = null

  if (commit === false) { render(); return }   // Esc 取消：按未改动的数组重建
  if (!moved) return

  const byId = new Map(arr.map(x => [x.id, x]))
  const next = [...list.children].map(el => byId.get(el.dataset.id)).filter(Boolean)
  if (next.length === arr.length) {
    arr.length = 0                 // 就地重排，保持数组引用不变
    arr.push(...next)
    save()
  } else {
    render()   // 对不上就按数据重建，避免顺序错乱
  }
}

function startEditPrompt(p, textWrap) {
  const ta = document.createElement('textarea')
  ta.className = 'cardEdit'
  ta.value = p.text
  let finished = false
  const done = (commit) => {
    if (finished) return
    finished = true
    const t = ta.value.trim()
    if (commit && t && t !== p.text) {
      p.text = t
      save()
    }
    render()
  }
  ta.onkeydown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') done(true)
    if (e.key === 'Escape') done(false)
  }
  ta.onblur = () => done(true)
  textWrap.replaceWith(ta)
  ta.style.height = Math.min(200, ta.scrollHeight + 4) + 'px'
  ta.focus()
  ta.selectionStart = ta.selectionEnd = ta.value.length
}

function renderFavorites() {
  const list = $('list')
  list.textContent = ''
  $('composer').style.display = 'none'

  if (state.favorites.length === 0) {
    const hint = document.createElement('div')
    hint.className = 'hint'
    hint.textContent = '还没有收藏\n在提示词卡片上点星标沉淀到这里'
    list.appendChild(hint)
    return
  }
  for (const f of state.favorites) {
    const card = document.createElement('div')
    card.className = 'card' + (f.collapsed ? ' collapsed' : '')
    card.dataset.id = f.id

    const left = buildLeftRail(card, f, state.favorites)

    const textWrap = document.createElement('div')
    textWrap.className = 'cardText' + (f.collapsed ? ' collapsed' : '')
    textWrap.title = '点击复制'
    textWrap.textContent = f.text
    const meta = document.createElement('div')
    meta.className = 'cardMeta'
    meta.textContent = `来自 ${f.sourceGroup} · ${new Date(f.createdAt).toLocaleDateString()}`
    textWrap.appendChild(meta)
    textWrap.onclick = () => copyText(f.text)

    const btns = document.createElement('div')
    btns.className = 'cardBtns'
    const delBtn = document.createElement('button')
    delBtn.innerHTML = icon('close', 11)
    delBtn.title = '删除收藏（进回收站，保留 7 天）'
    delBtn.onclick = () => {
      trashItem('fav', f.text, null, f.sourceGroup, f.createdAt)
      state.favorites = state.favorites.filter(x => x.id !== f.id)
      save()
      render()
      toast('已移入回收站')
    }
    btns.appendChild(delBtn)

    card.append(left, textWrap, btns)
    list.appendChild(card)
  }
}

function renderTrash() {
  const list = $('list')
  list.textContent = ''
  $('composer').style.display = 'none'

  if (state.trash.length === 0) {
    const hint = document.createElement('div')
    hint.className = 'hint'
    hint.textContent = '回收站是空的\n删除的提示词会在这里保留 7 天'
    list.appendChild(hint)
    return
  }
  for (const t of [...state.trash].reverse()) {
    const card = document.createElement('div')
    card.className = 'card'

    const textWrap = document.createElement('div')
    textWrap.className = 'cardText'
    textWrap.title = '点击复制'
    textWrap.textContent = t.text
    const meta = document.createElement('div')
    meta.className = 'cardMeta'
    const daysLeft = Math.max(1, Math.ceil((TRASH_KEEP_MS - (Date.now() - t.deletedAt)) / 86400000))
    const from = t.kind === 'fav' ? `收藏（来自 ${t.sourceGroup}）`
      : t.kind === 'todo' ? `待办（来自 ${t.sourceGroup}）`
      : `来自 ${t.sourceGroup}`
    meta.textContent = `${from} · ${daysLeft} 天后自动清除`
    textWrap.appendChild(meta)
    textWrap.onclick = () => copyText(t.text)

    const btns = document.createElement('div')
    btns.className = 'cardBtns'

    const restoreBtn = document.createElement('button')
    restoreBtn.innerHTML = icon('restore', 11)
    restoreBtn.title = t.kind === 'fav' ? '恢复到收藏区' : '恢复到原分组'
    restoreBtn.onclick = () => restoreTrashItem(t)

    const delBtn = document.createElement('button')
    delBtn.innerHTML = icon('close', 11)
    delBtn.title = '彻底删除'
    delBtn.onclick = () => {
      if (!confirm('彻底删除？无法恢复。')) return
      state.trash = state.trash.filter(x => x.id !== t.id)
      save()
      render()
    }

    btns.append(restoreBtn, delBtn)
    card.append(textWrap, btns)
    list.appendChild(card)
  }
}

function restoreTrashItem(t) {
  state.trash = state.trash.filter(x => x.id !== t.id)
  if (t.kind === 'todo') {
    const g = state.todoGroups.find(x => x.id === t.sourceGroupId) || state.todoGroups[0]
    g.todos.push({ id: uid(), text: t.text, createdAt: t.createdAt, done: false, due: t.due })
  } else if (t.kind === 'fav') {
    state.favorites.unshift({ id: uid(), text: t.text, sourceGroup: t.sourceGroup, createdAt: t.createdAt })
  } else {
    let g = state.groups.find(x => x.id === t.sourceGroupId)
      || state.groups.find(x => x.name === t.sourceGroup)
    if (!g) {
      g = { id: uid(), name: t.sourceGroup || '已恢复', prompts: [] }
      state.groups.push(g)
    }
    g.prompts.push({ id: uid(), text: t.text, createdAt: t.createdAt })
  }
  save()
  render()
  toast('已恢复')
}

function addPrompt() {
  const g = curGroup()
  if (!g) return
  const text = $('draft').value.trim()
  if (!text) return
  if (isTodo()) g.todos.push({ id: uid(), text, createdAt: Date.now(), done: false })
  else g.prompts.push({ id: uid(), text, createdAt: Date.now() })
  drafts[g.id] = ''
  save()
  render()
  $('list').scrollTop = $('list').scrollHeight
  $('draft').focus()
}

/* 顶栏按钮 */
$('groupBtn').onclick = (e) => {
  e.stopPropagation()
  menuOpen = !menuOpen
  render()
}
document.addEventListener('click', (e) => {
  if (menuOpen && !e.target.closest('#groupWrap')) {
    menuOpen = false
    render()
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (datePop) { closeDatePicker(); return }
  if (dragState) { endDrag(false); return }
  if (menuOpen) {
    menuOpen = false
    render()
  }
})

$('favBtn').onclick = () => {
  view = view === 'fav' ? 'group' : 'fav'
  render()
}

// 点顶栏空白处切换折叠。折叠态整行都是空白，点哪都行。
// 「点的是不是控件」必须在按下的瞬间就判定：像主题键那样会重画自己图标的按钮，
// 等 click 冒泡上来时原来的元素已经被换掉，事后再判断会误判成空白。
let barHitControl = false
$('tabbar').addEventListener('pointerdown', (e) => {
  barHitControl = !!e.target.closest('button, #groupWrap, #modeSwitch')
})
$('tabbar').onclick = () => {
  if (state.collapsed) { setCollapsed(false); return }
  if (menuOpen) return          // 这一下是用来关下拉菜单的，不折叠
  if (barHitControl) return
  setCollapsed(true)
}

$('modeSwitch').onclick = (e) => {
  const b = e.target.closest('button[data-mode]')
  if (!b || b.dataset.mode === state.mode) return
  state.mode = b.dataset.mode
  view = 'group'          // 从收藏区/回收站切板块时回到列表
  menuOpen = false
  save()
  render()
}

$('trashBtn').onclick = () => {
  view = view === 'trash' ? 'group' : 'trash'
  render()
}

$('pinBtn').onclick = () => {
  state.pinned = !state.pinned
  window.api.setPinned(state.pinned)
  save()
  applySettings()
  toast(state.pinned ? '已置顶' : '已取消置顶')
}

$('themeBtn').onclick = () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light'
  save()
  applySettings()
}

$('addBtn').onclick = addPrompt
$('draft').oninput = () => {
  const g = curGroup()
  if (g) drafts[g.id] = $('draft').value
}
$('draft').onkeydown = (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') addPrompt()
}

/* 初始化 */
;(async () => {
  state = await window.api.loadData()
  if (!state) {
    state = {
      version: 1,
      pinned: true,
      theme: 'dark',
      mode: 'prompt',
      activeGroupId: null,
      groups: [
        { id: uid(), name: 'Hermes', prompts: [] },
        { id: uid(), name: 'Claude Code', prompts: [] },
      ],
      favorites: [],
    }
    state.activeGroupId = state.groups[0].id
    save()
  }
  // 旧数据补默认设置
  if (state.pinned === undefined) state.pinned = true
  if (!state.theme) state.theme = 'dark'
  if (!state.trash) state.trash = []
  // 待办板块：老数据文件没有这块，补一份空的（不动任何已有的提示词数据）
  if (!state.mode) state.mode = 'prompt'
  if (!state.todoGroups) state.todoGroups = QUADRANTS.map(q => ({ id: q.id, name: q.name, todos: [] }))
  if (!state.activeTodoGroupId) state.activeTodoGroupId = state.todoGroups[0].id
  // 收藏区原先是倒序显示的；现在可以手动拖动排序了，改为按数组顺序显示。
  // 这里把存储顺序反转一次，保证升级后看到的排列跟原来一模一样。
  if (!state.favOrdered) {
    state.favorites.reverse()
    state.favOrdered = true
    save()
  }
  $('favBtn').innerHTML = icon('star', 14)
  $('trashBtn').innerHTML = icon('trash', 14)
  $('pinBtn').innerHTML = icon('pin', 14)
  // 清掉回收站里超过 7 天的
  const before = state.trash.length
  state.trash = state.trash.filter(t => Date.now() - t.deletedAt < TRASH_KEEP_MS)
  if (state.trash.length !== before) save()
  applySettings()
  applyCollapsed(false)
  render()
  window.api.ready()          // 尺寸就位后再让窗口显示，避免闪一下
})()
</script>
</body>
</html>
